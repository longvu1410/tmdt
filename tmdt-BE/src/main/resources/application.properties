spring.application.name=tmdt
spring.config.import=optional:file:.env[.properties],optional:file:tmdt-BE/.env[.properties],optional:file:../.env[.properties]
server.port=8080

spring.datasource.url=${DB_URL_1}
spring.datasource.username=${DB_USERNAME_1}
spring.datasource.password=${DB_PASSWORD_1}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=${REDIS_DATABASE}
spring.data.redis.password=${REDIS_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.user-created-topic=${KAFKA_USER_CREATED_TOPIC}
app.kafka.user-updated-topic=${KAFKA_USER_UPDATED_TOPIC}
app.kafka.user-follow-topic=${KAFKA_USER_FOLLOW_TOPIC}
spring.kafka.producer.properties.spring.json.add.type.headers=true

app.web.base-url=${APP_WEB_BASE_URL:http://localhost:5173}
app.email.verification-token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@example.com}}
app.mail.fail-on-error=${MAIL_FAIL_ON_ERROR:false}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:${MAIL_HOST:}}



server.forward-headers-strategy=framework
